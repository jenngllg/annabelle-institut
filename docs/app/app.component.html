

<body>
<!-- PayPlug -->
<script type="text/javascript" src="https://secure.payplug.com/static/button/scripts/payplug.js" defer></script>


  <div class="page">

    <mat-toolbar>
      <mat-toolbar-row>

        <div class="menu">
          <mat-menu #appMenu="matMenu">
            <button mat-menu-item [routerLink]="['/home']">Accueil</button>
            <button mat-menu-item [matMenuTriggerFor]="prestations">Prestations</button>
            <button mat-menu-item [routerLink]="['/creations']">Réalisations</button>
            <button mat-menu-item [routerLink]="['/infos']">Horaires & plan d'accès</button>
          </mat-menu>

          <mat-menu #prestations="matMenu">
            <button mat-menu-item [routerLink]="['/hands-foots-care']">Soins des mains et pieds</button>
            <button mat-menu-item [routerLink]="['/look']">Beauté du regard</button>
            <button mat-menu-item [routerLink]="['/face-care']">Soins du visage</button>
            <button mat-menu-item [routerLink]="['/body-care']">Soins du corps</button>
            <button mat-menu-item [routerLink]="['/slimming']">Amincissement</button>
            <button mat-menu-item [routerLink]="['/permanent-hair-removal']">Lumière pulsée</button>
            <button mat-menu-item [routerLink]="['/waxing']">Épilation pour elle</button>
            <button mat-menu-item [routerLink]="['/men']">Épilation pour lui</button>
            <button mat-menu-item [routerLink]="['/piercing']">Piercing</button>
            <button mat-menu-item [routerLink]="['/permanent']">Maquillage permanent</button>
            <button mat-menu-item [routerLink]="['/mesotherapy']">Mésothérapie</button>
            <button mat-menu-item [routerLink]="['/events']">Evènementiel</button>
            <button mat-menu-item [routerLink]="['/photorejuvenation']">Photo-rajeunissement</button>
          </mat-menu>

          <button mat-icon-button [matMenuTriggerFor]="appMenu" aria-label="Menu">
            <mat-icon>menu</mat-icon>
          </button>
        </div>

        <span class="spacer"></span>

        <div id="annabelle-logo">
          <img src="../assets/images/logo/logo-white.png" alt="Logo Anna'belle" fetchpriority="high">
        </div>

        <span class="spacer"></span>

        <div class="social-medias">
          <a href="https://www.facebook.com/institutannabellecolmar/" aria-label="Facebook">
            <i class="fab fa-facebook-square fa-2x" aria-hidden="true"></i>
          </a>
          <a href="https://www.instagram.com/annabelle_institut_colmar/" aria-label="Instagram">
            <i class="fab fa-instagram fa-2x" aria-hidden="true"></i>
          </a>
        </div>

      </mat-toolbar-row>
    </mat-toolbar>

    <div class="content" role="main">
      <router-outlet></router-outlet>
    </div>

    <footer class="page-footer font-small pt-4">
      <div class="container text-center text-md-left">
        <div class="row">

          <hr class="clearfix w-100 d-md-none">
          <div class="col-md-2 col-lg-2 mx-auto my-md-4 my-0 mt-4 mb-1">
            <h5 class="font-weight-bold text-uppercase mb-4">Nous rejoindre</h5>
            <hr class="black accent-3 mb-4 mt-0 d-inline-block mx-auto" style="width: 60px;">
            <ul class="list-unstyled">
              <li>

            <hr class="black accent-3 mb-4 mt-0 d-inline-block mx-auto" style="width: 60px;">
            <ul class="list-unstyled">
              <li>
                <p>
                  <a href="/legal-notice">Mentions légales et conditions générales d'utilisation</a>
                </p>
              </li>

          </div>
          <hr class="clearfix w-100 d-md-none">
          <div class="col-md-4 col-lg-4 mx-auto my-md-4 my-0 mt-4 mb-1">
            <h5 class="font-weight-bold text-uppercase mb-4">Contact</h5>
            <hr class="black accent-3 mb-4 mt-0 d-inline-block mx-auto" style="width: 60px;">
            <ul class="list-unstyled">
              <li>
                <p>
                  <i class="fas fa-map-marker-alt mr-3"></i> 10 rue Vauban, 68000 COLMAR</p>
              </li>
              <li>
                <p>
                  <i class="fas fa-envelope mr-3"></i><a
                    href="mailto:annabelleinstitutcolmar@gmail.com">annabelleinstitutcolmar@gmail.com</a></p>
              </li>
              <li>
                <p>
                  <i class="fas fa-phone mr-3"></i> <a href="tel:+33982413466">09 82 41 34 66</a></p>
              </li>
            </ul>
          </div>
          <hr class="clearfix w-100 d-md-none">
          <div class="col-md-2 col-lg-2 mx-auto my-4">
            <h5 class="font-weight-bold text-uppercase mb-4">Suivez-nous</h5>
            <hr class="black accent-3 mb-4 mt-0 d-inline-block mx-auto" style="width: 80px;">
            <ul class="list-unstyled text-md-left">
              <li><a type="button" class="btn-floating btn-fb" href="https://www.facebook.com/institutannabellecolmar/" aria-label="Facebook"><i class="fab fa-facebook-square" aria-hidden="true"></i></a></li>
              <li><a type="button" class="btn-floating btn-fb" href="https://www.instagram.com/annabelle_institut_colmar/" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a></li>
            </ul>
            <h5 class="font-weight-bold text-uppercase mb-4">Paiements</h5>
            <hr class="black accent-3 mb-4 mt-0 d-inline-block mx-auto" style="width: 80px;">
            <ul class="list-unstyled text-md-left">
              <li><img src="./../assets/images/logo/cb.jpg" alt="Logo CB"></li>
              <li><img src="./../assets/images/logo/visa.png" alt="Logo VISA"></li>
              <li><img src="./../assets/images/logo/mastercard.png" alt="Logo MasterCard"></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="footer-copyright text-center py-3">
