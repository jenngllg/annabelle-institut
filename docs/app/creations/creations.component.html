<h1>NOS RÉALISATIONS</h1>

<div class="gallery" *ngIf="posts.length">
    <a class="post" *ngFor="let post of posts" [href]="post.permalink" target="_blank" rel="noopener"
        [title]="altText(post)">
        <img [src]="post.image" [alt]="altText(post)" loading="lazy" width="320" height="320">
        <i class="fas fa-play video-badge" *ngIf="post.video" aria-hidden="true"></i>
    </a>
</div>

<p class="feed-empty" *ngIf="!loading && !posts.length">Retrouvez toutes nos réalisations sur Instagram.</p>

<p class="feed-link">
    <a [href]="instagramUrl" target="_blank" rel="noopener">
        <i class="fab fa-instagram" aria-hidden="true"></i> Voir notre compte Instagram
    </a>
</p>
